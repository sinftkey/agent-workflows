name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 占位符校验命令有效性（固化适配指南第 4 节的修正）
        # 防回归：-E 写法的 grep 必须能匹配真实 {{...}} 占位符
        # （BRE 下 + 是字面量，会让校验形同虚设，见 REVIEW-2026-08-20 P0-1）
        run: |
          echo '{{项目名}}' | grep -qoE '{{[^{}]+}}' || { echo "::error::grep -E 占位符校验命令失效"; exit 1; }
          echo '{{项目名}}' | grep -qo '{{[^{}]+}}' && { echo "::error::BRE 写法 '{{[^{}]+}}' 不应匹配成功"; exit 1; } || true
          echo "占位符校验命令有效"

      - name: Markdown 相对链接有效
        run: |
          tmpfile="$(mktemp)"
          find . -name '*.md' -not -path './.git/*' -print0 | while IFS= read -r -d '' f; do
            dir="$(dirname "$f")"
            grep -oE '\]\([^)[:space:]]+\)' "$f" | sed -e 's/^..//' -e 's/.$//' | while IFS= read -r link; do
              case "$link" in
                http://*|https://*|mailto:*) : ;;  # 外部链接不在检查范围
                *)
                  target="${link%%#*}"              # 去掉页内锚点
                  [ -z "$target" ] && continue
                  [ -e "$dir/$target" ] || echo "$f: $link" >> "$tmpfile" ;;
              esac
            done
          done
          if [ -s "$tmpfile" ]; then
            echo "::error::无效链接："
            cat "$tmpfile"
            rm -f "$tmpfile"
            exit 1
          fi
          rm -f "$tmpfile"
          echo "链接检查通过"
